<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IQUIZ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="intro">
      <header class="header">
        <div class="container">
          <a class="logo" href="#" aria-label="IQUIZ">
            <img class="logo__rocket" src="img/logo-rocket.png" alt="" />

            <span class="logo__text">IQUIZ:</span>
          </a>
        </div>
      </header>

      <section class="hero">
        <div class="container">
          <div class="hero__inner">
            <div class="hero__content">
              <h1 class="hero__title">
                Допомагаємо<br />
                отримати нові<br />
                заявки
              </h1>

              <p class="hero__text">
                Почніть використовувати квізи на сайті та в соціальних мережах
                та отримайте додатковий дохід
              </p>

              <a class="button hero__button" href="#"> Дізнатись детальніше </a>
            </div>

            <div class="hero__visual">
              <img class="hero__image" src="img/hero-visual.png" alt="" />
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
